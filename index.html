<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-8"/>
    <title>AAA's iosdump</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f0f0f0;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-color: #764ba2;
            background-image:
                radial-gradient(at 0% 0%, #667eea 0px, transparent 50%),
                radial-gradient(at 50% 0%, #e0c3fc 0px, transparent 50%),
                radial-gradient(at 100% 0%, #8ec5fc 0px, transparent 50%),
                radial-gradient(at 0% 100%, #4facfe 0px, transparent 50%),
                radial-gradient(at 100% 100%, #00f2fe 0px, transparent 50%);
        }
        .card-anchor {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .main-container {
            text-align: center;
            padding: 50px 30px;
            border-radius: 25px;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.1s ease;
        }
        .main-container * {
            color: #ffffff;
            position: relative;
            z-index: 5;
        }
        .top-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
        }
        .repo-subtitle {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
        }
        .add-source-btn {
            display: block;
            width: 100%;
            padding: 20px;
            font-size: 20px;
            text-decoration: none;
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 50px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .add-source-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .add-source-btn i {
            margin-right: 10px;
        }
        .contact-section {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 30px;
            text-align: center;
        }
        .contact-title {
            font-size: 20px;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
        }
        .infringement-tip {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: center;
        }
        .contact-link {
            display: inline-flex;
            align-items: center;
            font-size: 16px;
            color: #ffffff !important;
            text-decoration: none;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .contact-link:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.03);
        }
        .contact-link i.fa-paper-plane {
            width: 20px;
            margin-right: 10px;
            text-align: center;
        }
        @media (max-width: 375px) {
            .top-title {
                font-size: 28px;
            }
            .repo-subtitle {
                font-size: 36px;
            }
            .add-source-btn {
                font-size: 18px;
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="card-anchor">
        <div class="main-container html-glass-card">
            <h1 class="top-title">iosdump</h1>
            <p class="repo-subtitle">越狱源</p>
            <a href="sileo://source/https://iosdumpzzz.github.io/iosdump.repo/" class="add-source-btn">
                <i class="fa fa-download"></i>添加到 Sileo
            </a>
            <div class="contact-section">
                <h3 class="contact-title">联系与声明</h3>
                <p class="infringement-tip">插件均为个人日常编写，完全免费使用，如有问题 and 更好的建议，请及时联系探讨。</p>
                <a href="tg://resolve?domain=iosdumpzzz" class="contact-link">
                    <i class="fa fa-paper-plane"></i>Telegram：@iosdump
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js" crossorigin="anonymous"></script>
    <script src="./scripts/html2canvas.min.js"></script>
    <script src="./scripts/liquidGL.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const glassEffect = liquidGL({
                target: ".html-glass-card",
                snapshot: ".bg-gradient",
                resolution: 1.5,
                refraction: 0.015,
                bevelDepth: 0.08,
                bevelWidth: 0.12,
                frost: 4,
                shadow: true,
                specular: true,
                reveal: "fade",
                tilt: false,
                magnify: 1
            });
            const card = document.querySelector(".html-glass-card");
            if (card) {
                document.addEventListener("mousemove", (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - (rect.left + rect.width / 2);
                    const y = e.clientY - (rect.top + rect.height / 2);
                    const rX = -(y / (rect.height / 2)) * 10;
                    const rY = (x / (rect.width / 2)) * 10;
                    gsap.to(card, {
                        rotateX: rX,
                        rotateY: rY,
                        duration: 0.5,
                        ease: "power2.out"
                    });
                    if (window.__liquidGLRenderer__) {
                        window.__liquidGLRenderer__.render();
                    }
                });
                document.addEventListener("mouseleave", () => {
                    gsap.to(card, {
                        rotateX: 0,
                        rotateY: 0,
                        duration: 0.8,
                        ease: "power2.out"
                    });
                });
            }
            window.addEventListener("load", function () {
                const lenis = new Lenis({
                    wrapper: window,
                    content: document.body,
                });
                liquidGL.syncWith({ lenis: lenis });
            });
        });
    </script>
</body>
</html>
