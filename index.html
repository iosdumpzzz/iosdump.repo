<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-8"/>
    <title>AAA's iosdump</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0f0c20;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            perspective: 1000px;
        }
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-color: #0f0c20;
            background-image:
                radial-gradient(at 0% 0%, #667eea 0px, transparent 55%),
                radial-gradient(at 50% 0%, #764ba2 0px, transparent 60%),
                radial-gradient(at 100% 0%, #e0c3fc 0px, transparent 55%),
                radial-gradient(at 0% 100%, #4facfe 0px, transparent 60%),
                radial-gradient(at 100% 100%, #00f2fe 0px, transparent 55%);
            filter: blur(10px);
            transform: scale(1.1);
        }
        .card-anchor {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .main-container {
            text-align: center;
            padding: 50px 30px;
            border-radius: 30px;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 4px 30px rgba(0, 0, 0, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                inset 0 10px 20px rgba(255, 255, 255, 0.15);
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            transition: transform 0.1s ease, box-shadow 0.3s ease;
        }
        .main-container:hover {
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.35),
                inset 0 1px 2px rgba(255, 255, 255, 0.5),
                inset 0 10px 25px rgba(255, 255, 255, 0.2);
        }
        .main-container * {
            color: #ffffff;
            transform: translateZ(20px);
        }
        .top-title {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .repo-subtitle {
            font-size: 44px;
            font-weight: 800;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .add-source-btn {
            display: block;
            width: 100%;
            padding: 20px;
            font-size: 20px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            margin-bottom: 50px;
            font-weight: 700;
            text-shadow: 0 1px 5px rgba(0,0,0,0.2);
            transform: translateZ(35px);
        }
        .add-source-btn:hover {
            transform: translateZ(45px) translateY(-3px);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
        }
        .add-source-btn i {
            margin-right: 12px;
        }
        .contact-section {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 35px;
            text-align: center;
            transform: translateZ(15px);
        }
        .contact-title {
            font-size: 20px;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .infringement-tip {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        .contact-link {
            display: inline-flex;
            align-items: center;
            font-size: 16px;
            color: #ffffff;
            text-decoration: none;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 22px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            transform: translateZ(25px);
        }
        .contact-link:hover {
            transform: translateZ(35px) scale(1.05);
            background: rgba(0, 0, 0, 0.45);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .contact-link i.fa-paper-plane {
            width: 20px;
            margin-right: 10px;
            text-align: center;
        }
        @media (max-width: 375px) {
            .top-title {
                font-size: 28px;
            }
            .repo-subtitle {
                font-size: 36px;
            }
            .add-source-btn {
                font-size: 18px;
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="card-anchor">
        <div class="main-container">
            <h1 class="top-title">iosdump</h1>
            <p class="repo-subtitle">越狱源</p>
            <a href="sileo://source/https://iosdumpzzz.github.io/iosdump.repo/" class="add-source-btn">
                <i class="fa fa-download"></i>添加到 Sileo
            </a>
            <div class="contact-section">
                <h3 class="contact-title">联系与声明</h3>
                <p class="infringement-tip">插件均为个人日常编写，完全免费使用，如有问题和更好的建议，请及时联系探讨。</p>
                <a href="tg://resolve?domain=iosdumpzzz" class="contact-link">
                    <i class="fa fa-paper-plane"></i>Telegram：@iosdump
                </a>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const card = document.querySelector(".main-container");
            const anchor = document.querySelector(".card-anchor");
            if (!card || !anchor) return;
            anchor.addEventListener("mousemove", (e) => {
                const rect = card.getBoundingClientRect();
                const xc = rect.left + rect.width / 2;
                const yc = rect.top + rect.height / 2;
                const pctX = (e.clientX - xc) / (rect.width / 2);
                const pctY = (e.clientY - yc) / (rect.height / 2);
                const rotY = pctX * 15;
                const rotX = -pctY * 15;
                card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            });
            anchor.addEventListener("mouseleave", () => {
                card.style.transition = "transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)";
                card.style.transform = "rotateX(0deg) rotateY(0deg)";
            });
            anchor.addEventListener("mouseenter", () => {
                card.style.transition = "none";
            });
            document.addEventListener("pointermove", (e) => {
                const x = e.clientX;
                const y = e.clientY;
                const r = card.getBoundingClientRect();
                const inside = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
                if (!inside && card.style.transition === "none") {
                    card.style.transition = "transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)";
                    card.style.transform = "rotateX(0deg) rotateY(0deg)";
                }
            });
        });
    </script>
</body>
</html>
